<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DROPLINK Driver</title>
<style>
:root{--navy:#002b67;--dark:#001a45;--gold:#e0a400;--gold2:#ffc928;--bg:#f4f7fb;--ink:#172234;--muted:#687489;--line:#dfe6ef;--green:#168047;--red:#c83245}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:82px}.brandbar{height:5px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--navy))}.top{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;padding:12px 14px;position:sticky;top:0;z-index:8}.topRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:42px}.topLeft{display:flex;align-items:center;gap:8px}.online{justify-self:center;background:#ffffff18;border:1px solid #ffffff40;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px}.profileMini{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff18;color:#fff}.wrap{padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px #002b6710}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:9px}.blue{background:var(--navy);color:#fff}.gold{background:linear-gradient(var(--gold2),var(--gold));color:#12213a}.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff}.login{min-height:calc(100vh - 5px);display:flex;flex-direction:column;justify-content:center;padding:28px 24px}.logoWrap{width:170px;height:170px;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}.logo{width:150px;height:150px;object-fit:contain}.name{text-align:center;font-size:42px;font-weight:900;color:var(--navy)}.name span{color:var(--gold)}.sub{text-align:center;color:var(--muted);margin:4px 0 26px}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}.stat .n{font-size:26px;font-weight:900;color:var(--navy)}.pill{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:bold;background:#e4efff;color:#174fa2}.job{border-left:4px solid var(--gold)}.route{margin:10px 0;padding:10px;background:#f7f9fc;border-radius:10px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 3px 8px;z-index:12}.nav button{border:0;background:#fff;color:var(--muted);padding:5px 1px 3px;font-size:10px}.nav .ico{display:block;font-size:20px}.nav .active{color:var(--navy);font-weight:bold}.back{border:0;background:none;color:#fff;font-size:22px}.photo{height:165px;border:2px dashed #b9c5d6;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#edf2f8}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:100%;object-fit:cover}.chatBox{display:flex;flex-direction:column;gap:8px;min-height:320px;max-height:55vh;overflow:auto}.bubble{max-width:82%;padding:10px 12px;border-radius:14px}.mine{align-self:flex-end;background:var(--navy);color:#fff}.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line)}.composer{display:grid;grid-template-columns:1fr 50px;gap:8px}.send{border:0;border-radius:12px;background:var(--gold);font-size:19px}.mapbox{height:300px;border-radius:15px;background:#e9eef5;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
</style></head><body><div class="app" id="app"></div><script>
const API_BASE='https://deutronomagroup.co.za/droplink-api/index.php';
function apiToken(){return localStorage.getItem('droplink_token')||''}
function setApiToken(t){localStorage.setItem('droplink_token',t||'')}
async function api(route,opt={}){
  const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{}); const t=apiToken(); if(t)headers.Authorization='Bearer '+t;
  const r=await fetch(API_BASE+'?route='+encodeURIComponent(route),Object.assign({},opt,{headers}));
  const j=await r.json().catch(()=>({ok:false,error:'Invalid server response'})); if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status)); return j;
}
function money(v){return 'R'+Number(v||0).toFixed(2).replace('.00','')}

let me=JSON.parse(localStorage.getItem('droplink_me')||'null'),jobs=[],cur=null,proofPhoto=null;const app=document.getElementById('app');const set=x=>{app.innerHTML='<div class="brandbar"></div>'+x;scrollTo(0,0)};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const logo=()=>`<img class="logo" src="file:///android_asset/deutronoma_symbol.png">`;function header(t,b=''){return `<div class="top"><div class="topRow"><div class="topLeft">${b?`<button class="back" onclick="${b}">←</button>`:''}<b>${t}</b></div><div class="online">● ONLINE</div><button class="profileMini" onclick="profile()">👤</button></div></div>`}function nav(a){return `<div class="nav"><button class="${a==='home'?'active':''}" onclick="home()"><span class="ico">⌂</span>Home</button><button class="${a==='jobs'?'active':''}" onclick="jobsScreen()"><span class="ico">▤</span>Deliveries</button><button class="${a==='map'?'active':''}" onclick="navigate()"><span class="ico">⌖</span>Navigate</button><button class="${a==='profile'?'active':''}" onclick="profile()"><span class="ico">◉</span>Profile</button></div>`}
function login(msg=''){set(`<div class="login"><div class="logoWrap">${logo()}</div><div class="name">DROP<span>LINK</span></div><div class="sub">Driver App</div><div class="card"><h2 style="text-align:center;color:var(--navy)">Driver Login</h2>${msg?`<p style="color:var(--red)">${esc(msg)}</p>`:''}<input class="field" id="login" placeholder="Driver phone / email"><input class="field" id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="doLogin()">Log In</button></div></div>`)}
async function doLogin(){try{let r=await api('auth/login',{method:'POST',body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('pass').value})});if(r.user.role!=='driver')throw new Error('Please use a driver account.');setApiToken(r.token);me=r.user;localStorage.setItem('droplink_me',JSON.stringify(me));startLocation();await refresh();home()}catch(e){login(e.message)}}
async function refresh(){let r=await api('orders');jobs=r.orders||[]}
function card(o){return `<div class="card job"><div class="row"><h3 style="color:var(--navy)">${esc(o.public_id)}</h3><span class="pill">${esc(o.status)}</span></div><b>${esc(o.customer_name)}</b><div class="small">${esc(o.pickup)} → ${esc(o.dropoff)}</div><p class="small">${esc(o.package_size)}</p><button class="btn gold" onclick="details('${esc(o.public_id)}')">Open Delivery</button></div>`}
async function home(){try{await refresh()}catch(e){}let done=jobs.filter(x=>x.status==='Delivered').length;set(`${header('DROPLINK')}<div class="wrap"><div class="stats"><div class="stat"><div class="n">${jobs.length}</div><div class="small">Assigned</div></div><div class="stat"><div class="n">${done}</div><div class="small">Delivered</div></div></div><h2 style="color:var(--navy)">My Deliveries</h2>${jobs.map(card).join('')||'<div class="card">No assigned deliveries.</div>'}</div>${nav('home')}`)}
async function jobsScreen(){try{await refresh()}catch(e){return alert(e.message)}set(`${header('Deliveries','home()')}<div class="wrap">${jobs.map(card).join('')||'<div class="card">No deliveries.</div>'}</div>${nav('jobs')}`)}
async function details(id){try{let r=await api('orders/'+id);cur=r.order;set(`${header(cur.public_id,'jobsScreen()')}<div class="wrap"><div class="card"><div class="row"><h3>Delivery Details</h3><span class="pill">${esc(cur.status)}</span></div><p><b>Customer:</b> ${esc(cur.customer_name)}<br>${esc(cur.customer_phone)}</p><div class="route"><b>Pickup</b><br>${esc(cur.pickup)}</div><div class="route"><b>Drop-off</b><br>${esc(cur.dropoff)}</div><p><b>Package:</b> ${esc(cur.package_size)}</p><button class="btn outline" onclick="dial('${esc(cur.customer_phone)}')">Call Customer</button><button class="btn outline" onclick="chat()">💬 Trip Chat</button><button class="btn blue" onclick="maps('${esc(cur.dropoff).replace(/'/g,"\\'")}')">Open Maps</button>${cur.status!=='Delivered'?`<button class="btn gold" onclick="setStatus('On the way')">Start / Continue Delivery</button><button class="btn outline" onclick="setStatus('Driver arrived')">I've Arrived — Notify Customer</button><button class="btn gold" onclick="proof()">Proof of Delivery</button>`:''}</div></div>${nav('jobs')}`)}catch(e){alert(e.message)}}
async function setStatus(s){try{let r=await api('orders/'+cur.public_id,{method:'PATCH',body:JSON.stringify({status:s})});cur=r.order;details(cur.public_id)}catch(e){alert(e.message)}}
function navigate(){if(cur){set(`${header('Navigation',`details('${cur.public_id}')`)}<div class="wrap"><div class="mapbox">Live position sharing is active while the driver app is open.<br>Use Google Maps for turn-by-turn navigation.</div><button class="btn blue" onclick="maps('${esc(cur.dropoff).replace(/'/g,"\\'")}')">Open in Google Maps</button></div>${nav('map')}`)}else jobsScreen()}
async function chat(){try{let r=await api('orders/'+cur.public_id+'/messages'),msgs=r.messages||[];set(`${header('Trip Chat',`details('${cur.public_id}')`)}<div class="wrap"><div class="card"><div class="chatBox" id="chatBox">${msgs.map(m=>`<div class="bubble ${m.sender_role==='driver'?'mine':'theirs'}">${esc(m.message)}</div>`).join('')}</div><div class="composer"><input class="field" id="msg" placeholder="Type a message..."><button class="send" onclick="sendMsg()">➤</button></div></div></div>${nav('jobs')}`)}catch(e){alert(e.message)}}
async function sendMsg(){let v=document.getElementById('msg').value.trim();if(!v)return;try{await api('orders/'+cur.public_id+'/messages',{method:'POST',body:JSON.stringify({message:v,recipient_scope:'customer'})});chat()}catch(e){alert(e.message)}}
function proof(){proofPhoto=null;set(`${header('Proof of Delivery',`details('${cur.public_id}')`)}<div class="wrap"><div class="card"><div class="photo" id="photoBox">Tap to add delivery photo<input id="photoInput" type="file" accept="image/*" onchange="preview(this)"></div><input class="field" id="recipient" placeholder="Recipient name"><textarea class="field" id="note" placeholder="Delivery note"></textarea><button class="btn gold" onclick="complete()">Complete Delivery</button></div></div>${nav('jobs')}`)}
function preview(i){proofPhoto=i.files&&i.files[0];if(!proofPhoto)return;let u=URL.createObjectURL(proofPhoto);document.getElementById('photoBox').innerHTML=`<img src="${u}">`}
async function complete(){try{let f=new FormData();f.append('recipient_name',document.getElementById('recipient').value);f.append('note',document.getElementById('note').value);if(proofPhoto)f.append('photo',proofPhoto);let headers={};let t=apiToken();if(t)headers.Authorization='Bearer '+t;let r=await fetch(API_BASE+'?route='+encodeURIComponent('orders/'+cur.public_id+'/proof'),{method:'POST',headers,body:f});let j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'Could not complete delivery');cur=j.order;await refresh();set(`${header('DROPLINK')}<div class="wrap"><div class="card" style="text-align:center"><div style="font-size:72px;color:var(--green)">✓</div><h2>Delivery Completed!</h2><p>${esc(cur.public_id)}</p><button class="btn blue" onclick="home()">Back to Home</button></div></div>${nav('home')}`)}catch(e){alert(e.message)}}
function startLocation(){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(async p=>{try{await api('driver/location',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy_m:p.coords.accuracy})})}catch(e){}},()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:15000})}
function profile(){set(`${header('Profile','home()')}<div class="wrap"><div class="card"><h2>${esc(me?.name||'Driver')}</h2><div class="small">${esc(me?.phone||'')}</div><button class="btn outline" onclick="logout()">Log Out</button></div></div>${nav('profile')}`)}function logout(){setApiToken('');localStorage.removeItem('droplink_me');me=null;login()}function maps(a){if(window.Android&&Android.openMaps)Android.openMaps(a);else location.href='geo:0,0?q='+encodeURIComponent(a)}function dial(p){if(window.Android&&Android.dial)Android.dial(p);else location.href='tel:'+p}
(async()=>{if(apiToken()){try{let r=await api('me');if(r.user.role!=='driver')throw 0;me=r.user;startLocation();await refresh();home();return}catch(e){}}login()})();
</script></body></html>
