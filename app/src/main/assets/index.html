<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DROPLINK</title><style>
:root{--n:#002b67;--nd:#001a45;--g:#e0a400;--gb:#ffc928;--bg:#f4f7fb;--ink:#172234;--m:#687489;--line:#dfe6ef;--ok:#178647;--bad:#c83245}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto}.bar{height:5px;background:linear-gradient(90deg,var(--n),var(--gb),var(--n))}.top{background:linear-gradient(135deg,var(--nd),var(--n));color:white;padding:17px;position:sticky;top:0;z-index:3}.top b{font-size:20px}.wrap{padding:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px #002b6710}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:9px}.blue{background:var(--n);color:white}.gold{background:linear-gradient(var(--gb),var(--g));color:#12213a}.outline{background:white;color:var(--n);border:1.5px solid var(--n)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:white}.splash{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:25px}.logo{width:150px;height:150px;object-fit:contain;margin:0 auto 12px;border-radius:28px}.name{text-align:center;font-size:42px;font-weight:900;color:var(--n)}.name span{color:var(--g)}.sub{text-align:center;color:var(--m);margin:4px 0 22px}.roles,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}.role strong{display:block;color:var(--n);margin-top:6px}.stat .n{font-size:25px;font-weight:900;color:var(--n)}.small{font-size:12px;color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:bold}.pending{background:#fff0bd;color:#6c5000}.progress{background:#e4efff;color:#174fa2}.done{background:#dcf3e4;color:#176832}.issue{background:#ffe0e5;color:#9b2030}.job{border-left:4px solid var(--g)}.job h3{margin:0;color:var(--n)}.route{margin:10px 0;padding:10px;background:#f7f9fc;border-radius:10px}.nav{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.nav button{border:0;background:white;color:var(--m);padding:7px;font-size:11px}.nav .active{color:var(--n);font-weight:bold}.map{height:280px;border-radius:15px;background:repeating-linear-gradient(30deg,#eef2f6 0 24px,#dce4ec 25px 30px,#eef2f6 31px 58px);position:relative;overflow:hidden}.path{position:absolute;background:#2468d8;height:7px;width:65%;left:18%;top:50%;transform:rotate(-18deg);border-radius:9px}.pin{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--n);border:4px solid white;box-shadow:0 2px 7px #777}.p1{left:20%;top:28%}.p2{right:18%;bottom:25%;background:var(--g)}.photo{height:165px;border:2px dashed #b9c5d6;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#edf2f8}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:100%;object-fit:cover}.success{text-align:center;font-size:72px;color:var(--ok)}h2{color:var(--n);font-size:18px}.back{border:0;background:none;color:white;font-size:20px;margin-right:10px}
</style></head><body><div class="app" id="app"></div><script>
const seed=[{id:'DLK-1001',customer:'John Doe',phone:'071 234 5678',pickup:'Maponya Mall, Soweto',dropoff:'123 Zone 9, Pimville',driver:'Thabo',status:'In Progress',items:'2 parcels'},{id:'DLK-1002',customer:'Naledi M.',phone:'072 555 1188',pickup:'Checkers, Orlando',dropoff:'Meadowlands, Soweto',driver:'Sipho',status:'Pending',items:'1 parcel'},{id:'DLK-1003',customer:'Client A',phone:'073 440 2221',pickup:'Pharmacy, Johannesburg',dropoff:'Protea Glen',driver:'Lerato',status:'Completed',items:'1 parcel'}];let jobs=JSON.parse(localStorage.getItem('dl_jobs')||'null')||seed,role='',cur=null;const app=document.getElementById('app');const save=()=>localStorage.setItem('dl_jobs',JSON.stringify(jobs));const set=x=>{app.innerHTML='<div class="bar"></div>'+x;scrollTo(0,0)};const badge=s=>`<span class="pill ${s==='Completed'?'done':s==='In Progress'?'progress':s==='Issue'?'issue':'pending'}">${s}</span>`;const val=id=>document.getElementById(id).value;
function splash(){set(`<div class="splash"><img class="logo" src="deutronoma_symbol.png"><div class="name">DROP<span>LINK</span></div><div class="sub">Deliver. Connect. Move Together.</div><div class="roles"><button class="role" onclick="login('driver')">🚚<strong>Driver</strong><span class="small">Deliveries & status</span></button><button class="role" onclick="login('controller')">🖥️<strong>Controller</strong><span class="small">Manage all deliveries</span></button></div></div>`)}
function login(r){role=r;set(`<div class="top"><b>${r==='driver'?'Driver':'Controller'} Login</b></div><div class="wrap"><div class="card"><img class="logo" style="width:100px;height:100px" src="deutronoma_symbol.png"><input class="field" placeholder="Phone / Email"><input class="field" type="password" placeholder="Password"><button class="btn gold" onclick="${r==='driver'?'driverHome()':'controllerHome()'}">Log In</button><button class="btn outline" onclick="splash()">Back</button><p class="small">TEST BUILD: any login details work.</p></div></div>`)}
function nav(a,r){return `<div class="nav"><button class="${a==='home'?'active':''}" onclick="${r==='driver'?'driverHome()':'controllerHome()'}">⌂<br>Home</button><button class="${a==='jobs'?'active':''}" onclick="${r==='driver'?'driverJobs()':'allJobs()'}">▤<br>Deliveries</button><button class="${a==='map'?'active':''}" onclick="liveMap('${r}')">⌖<br>Map</button><button onclick="splash()">◉<br>Logout</button></div>`}
function jobCard(j,drv=true){return `<div class="card job"><div class="row"><h3>${j.id}</h3>${badge(j.status)}</div><p><b>${j.customer}</b></p><div class="small">${j.pickup} → ${j.dropoff}</div><p class="small">Driver: ${j.driver}</p>${drv?`<button class="btn gold" onclick="details('${j.id}')">Open Delivery</button>`:''}</div>`}
function driverHome(){let mine=jobs.filter(j=>j.driver==='Thabo'),done=mine.filter(j=>j.status==='Completed').length;set(`<div class="top"><b>DROPLINK Driver</b><div class="small" style="color:#d8e3f3">Hello, Thabo • Online</div></div><div class="wrap"><div class="stats"><div class="stat"><div class="n">${mine.length}</div><div class="small">Assigned</div></div><div class="stat"><div class="n">${done}</div><div class="small">Completed</div></div></div><h2>My Deliveries</h2>${mine.map(j=>jobCard(j)).join('')||'<div class="card">No assigned deliveries.</div>'}</div>${nav('home','driver')}`)}
function driverJobs(){set(`<div class="top"><button class="back" onclick="driverHome()">←</button><b>My Deliveries</b></div><div class="wrap">${jobs.filter(j=>j.driver==='Thabo').map(j=>jobCard(j)).join('')}</div>${nav('jobs','driver')}`)}
function details(id){cur=jobs.find(j=>j.id===id);set(`<div class="top"><button class="back" onclick="driverHome()">←</button><b>${cur.id}</b></div><div class="wrap"><div class="card"><div class="row"><h3>Delivery Details</h3>${badge(cur.status)}</div><div class="route"><b>📍 Pickup</b><br>${cur.pickup}</div><div class="route"><b>🏁 Drop-off</b><br>${cur.dropoff}</div><p><b>Customer:</b> ${cur.customer}</p><p><b>Package:</b> ${cur.items}</p><button class="btn outline" onclick="dial('${cur.phone}')">Call Customer</button><button class="btn blue" onclick="maps('${cur.dropoff}')">Open Maps</button><button class="btn gold" onclick="startDelivery()">Start / Continue Delivery</button></div></div>`)}
function startDelivery(){cur.status='In Progress';save();liveMap('driver')}
function maps(a){if(window.Android&&Android.openMaps)Android.openMaps(a);else alert('Maps: '+a)}function dial(p){if(window.Android&&Android.dial)Android.dial(p);else location.href='tel:'+p}
function liveMap(r){set(`<div class="top"><button class="back" onclick="${r==='driver'?'driverHome()':'controllerHome()'}">←</button><b>${r==='driver'?'Navigation':'Live Tracking'}</b></div><div class="wrap"><div class="map"><div class="path"></div><div class="pin p1"></div><div class="pin p2"></div></div><div class="card"><b>${r==='driver'?(cur?cur.id:'Active route'):'Drivers online: 4'}</b><p class="small">${r==='driver'&&cur?cur.pickup+' → '+cur.dropoff:'Simulated live map for this test build.'}</p>${r==='driver'?'<button class="btn gold" onclick="proof()">I\'m at the location</button>':'<button class="btn outline" onclick="allJobs()">View all deliveries</button>'}</div></div>${nav('map',r)}`)}
function proof(){set(`<div class="top"><button class="back" onclick="details('${cur.id}')">←</button><b>Proof of Delivery</b></div><div class="wrap"><div class="card"><div class="photo" id="photo">Tap to add delivery photo<input type="file" accept="image/*" onchange="preview(this)"></div><input class="field" id="recipient" placeholder="Recipient name"><textarea class="field" id="note" placeholder="Delivery note"></textarea><button class="btn gold" onclick="complete()">Complete Delivery</button></div></div>`)}function preview(i){let f=i.files[0];if(!f)return;let u=URL.createObjectURL(f);document.getElementById('photo').innerHTML=`<img src="${u}">`}
function complete(){cur.status='Completed';save();set(`<div class="top"><b>DROPLINK</b></div><div class="wrap"><div class="card"><div class="success">✓</div><h2 style="text-align:center">Delivery Completed!</h2><p style="text-align:center">${cur.id} has been marked completed.</p><button class="btn blue" onclick="driverHome()">Back to Home</button></div></div>`)}
function controllerHome(){let d=jobs.filter(j=>j.status==='Completed').length,p=jobs.filter(j=>j.status==='Pending').length,ip=jobs.filter(j=>j.status==='In Progress').length;set(`<div class="top"><b>DROPLINK Controller</b><div class="small" style="color:#d8e3f3">Control • Track • Manage</div></div><div class="wrap"><div class="stats"><div class="stat"><div class="n">${jobs.length}</div><div class="small">Total</div></div><div class="stat"><div class="n">${ip}</div><div class="small">In progress</div></div><div class="stat"><div class="n">${d}</div><div class="small">Completed</div></div><div class="stat"><div class="n">${p}</div><div class="small">Pending</div></div></div><button class="btn gold" onclick="newJob()">＋ Create Delivery</button><button class="btn blue" onclick="liveMap('controller')">⌖ Live Tracking</button><h2>Recent Deliveries</h2>${jobs.slice().reverse().map(j=>jobCard(j,false)).join('')}</div>${nav('home','controller')}`)}
function allJobs(){set(`<div class="top"><button class="back" onclick="controllerHome()">←</button><b>All Deliveries</b></div><div class="wrap"><input id="q" class="field" placeholder="Search ID, customer or driver" oninput="filter()"><div id="list">${jobs.map(j=>`<div class="cj" data-q="${(j.id+' '+j.customer+' '+j.driver).toLowerCase()}">${jobCard(j,false)}</div>`).join('')}</div></div>${nav('jobs','controller')}`)}function filter(){let q=val('q').toLowerCase();document.querySelectorAll('.cj').forEach(x=>x.style.display=x.dataset.q.includes(q)?'block':'none')}
function newJob(){set(`<div class="top"><button class="back" onclick="controllerHome()">←</button><b>Create Delivery</b></div><div class="wrap"><div class="card"><input id="c" class="field" placeholder="Customer name"><input id="ph" class="field" placeholder="Phone"><input id="pu" class="field" placeholder="Pickup address"><input id="do" class="field" placeholder="Drop-off address"><input id="it" class="field" placeholder="Package details"><select id="dr" class="field"><option>Thabo</option><option>Sipho</option><option>Lerato</option><option>Musa</option></select><button class="btn gold" onclick="createJob()">Create & Assign</button></div></div>`)}function createJob(){jobs.push({id:'DLK-'+(1001+jobs.length),customer:val('c')||'New Customer',phone:val('ph')||'No phone',pickup:val('pu')||'Pickup',dropoff:val('do')||'Drop-off',driver:val('dr'),status:'Pending',items:val('it')||'1 parcel'});save();controllerHome()}
splash();
</script></body></html>
