<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DROPLINK Driver</title>
<style>
:root{--navy:#002b67;--dark:#001a45;--gold:#e0a400;--gold2:#ffc928;--bg:#f4f7fb;--ink:#172234;--muted:#687489;--line:#dfe6ef;--green:#168047;--red:#c83245}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:82px}.brandbar{height:5px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--navy))}.top{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;padding:12px 14px;position:sticky;top:0;z-index:8;box-shadow:0 3px 12px #001a4520}.topRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:42px}.topLeft{justify-self:start;display:flex;align-items:center;gap:8px;min-width:0}.topLeft b{font-size:17px;white-space:nowrap}.online{justify-self:center;background:#ffffff18;border:1px solid #ffffff40;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;letter-spacing:.6px}.onlineDot{display:inline-block;width:8px;height:8px;background:#35d36b;border-radius:50%;margin-right:6px;box-shadow:0 0 0 3px #35d36b25}.profileMini{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff18;color:#fff;font-size:17px}.wrap{padding:15px 15px 22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px #002b6710}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:9px}.blue{background:var(--navy);color:#fff}.gold{background:linear-gradient(var(--gold2),var(--gold));color:#12213a}.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff}.login{min-height:calc(100vh - 5px);display:flex;flex-direction:column;justify-content:center;padding:28px 24px}.logoWrap{width:170px;height:170px;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px #002b6714;overflow:hidden}.logo{display:block;width:150px;height:150px;object-fit:contain;margin:0}.name{text-align:center;font-size:42px;font-weight:900;color:var(--navy);letter-spacing:-1px}.name span{color:var(--gold)}.sub{text-align:center;color:var(--muted);margin:4px 0 26px}.loginTitle{text-align:center;color:var(--navy);font-size:18px;font-weight:800;margin-bottom:10px}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}.stat .n{font-size:26px;font-weight:900;color:var(--navy)}.pill{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:bold}.pending{background:#fff0bd;color:#6c5000}.progress{background:#e4efff;color:#174fa2}.arrived{background:#fff4d6;color:#8b6200}.done{background:#dcf3e4;color:#176832}.issue{background:#ffe0e5;color:#9b2030}.job{border-left:4px solid var(--gold)}.job h3{margin:0;color:var(--navy)}.route{margin:10px 0;padding:10px;background:#f7f9fc;border-radius:10px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 3px 8px;z-index:12;box-shadow:0 -5px 22px #001a4516}.nav button{border:0;background:#fff;color:var(--muted);padding:5px 1px 3px;font-size:10px;min-width:0}.nav .ico{display:block;font-size:20px;line-height:23px}.nav .active{color:var(--navy);font-weight:bold}.nav .active .ico{color:var(--gold)}.back{border:0;background:none;color:#fff;font-size:22px;padding:4px 4px 4px 0}.map{height:280px;border-radius:15px;background:repeating-linear-gradient(30deg,#eef2f6 0 24px,#dce4ec 25px 30px,#eef2f6 31px 58px);position:relative;overflow:hidden}.path{position:absolute;background:#2468d8;height:7px;width:65%;left:18%;top:50%;transform:rotate(-18deg);border-radius:9px}.pin{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--navy);border:4px solid #fff;box-shadow:0 2px 7px #777}.p1{left:20%;top:28%}.p2{right:18%;bottom:25%;background:var(--gold)}.photo{height:165px;border:2px dashed #b9c5d6;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#edf2f8}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:100%;object-fit:cover}.success{text-align:center;font-size:72px;color:var(--green)}h2{color:var(--navy);font-size:18px}.customerLine{display:flex;align-items:center;gap:11px;margin:12px 0}.customerAvatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#eaf1fb,#fff3cc);border:2px solid #fff;box-shadow:0 2px 8px #002b6722;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}.customerAvatar svg{width:31px;height:31px}.customerText{min-width:0}.customerText b{display:block;font-size:15px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customerText span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.customerDetail{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 12px}.chatTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.chatTabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:var(--navy);font-weight:700}.chatTabs .selected{background:var(--navy);color:#fff}.messages{display:flex;flex-direction:column;gap:8px;min-height:340px;max-height:55vh;overflow:auto;padding:4px 0 10px}.bubble{max-width:80%;padding:10px 12px;border-radius:15px;font-size:14px;line-height:1.35}.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}.msgTime{font-size:9px;opacity:.65;margin-top:4px}.chatComposer{display:grid;grid-template-columns:1fr 48px;gap:8px}.chatComposer input{margin:0}.sendBtn{border:0;border-radius:12px;background:var(--gold);font-size:20px}.profileCard{text-align:center}.profileAvatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,var(--navy),#174f91);color:#fff;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;border:4px solid #fff;box-shadow:0 4px 16px #002b6725}.soundRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:#fff8df;border:1px solid #f2d76b;border-radius:12px;padding:10px 12px;color:#6d5700;font-size:12px;margin:10px 0}.arrivedBox{background:#fff8df;border:1px solid #efd36b;border-radius:12px;padding:12px;margin:10px 0}.tripChatIntro{background:#eef5ff;border:1px solid #cddff8;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#35506f}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const seed=[{id:'DLK-1001',customer:'John Doe',phone:'071 234 5678',pickup:'Maponya Mall, Soweto',dropoff:'123 Zone 9, Pimville',driver:'Thabo',status:'In Progress',items:'2 parcels'},{id:'DLK-1002',customer:'Naledi M.',phone:'072 555 1188',pickup:'Checkers, Orlando',dropoff:'Meadowlands, Soweto',driver:'Thabo',status:'Pending',items:'1 parcel'},{id:'DLK-1003',customer:'Client A',phone:'073 440 2221',pickup:'Pharmacy, Johannesburg',dropoff:'Protea Glen',driver:'Thabo',status:'Completed',items:'1 parcel'}];
let jobs=JSON.parse(localStorage.getItem('dl_jobs')||'null')||seed,cur=null,chatMode='customer';
let chats=JSON.parse(localStorage.getItem('dl_chats')||'null')||{control:[{from:'them',text:'Welcome to DROPLINK. Control is online.',time:'18:00'}],customer:[{from:'them',text:'Hi driver, please call me when you are close.',time:'18:02'}]};
const app=document.getElementById('app');
const save=()=>localStorage.setItem('dl_jobs',JSON.stringify(jobs));
const saveChats=()=>localStorage.setItem('dl_chats',JSON.stringify(chats));
const set=x=>{app.innerHTML='<div class="brandbar"></div>'+x;scrollTo(0,0)};
const badge=s=>`<span class="pill ${s==='Completed'?'done':s==='In Progress'?'progress':s==='Arrived'?'arrived':s==='Issue'?'issue':'pending'}">${s}</span>`;
function logoTag(){return `<img class="logo" src="file:///android_asset/deutronoma_symbol.png" alt="Deutronoma logo" onerror="this.onerror=null;this.src='file:///android_res/drawable/droplink_logo.png';">`}
function avatar(){return `<div class="customerAvatar" aria-label="Customer profile image"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="23" r="12" fill="#002b67"/><path d="M12 56c2-12 10-19 20-19s18 7 20 19" fill="#e0a400"/><circle cx="32" cy="32" r="30" fill="none" stroke="#002b67" stroke-width="2" opacity=".12"/></svg></div>`}
function customerBlock(j,showPhone=false){return `<div class="customerLine">${avatar()}<div class="customerText"><b>${j.customer}</b><span>${showPhone?j.phone:'Customer'}</span></div></div>`}
function header(title,back=''){return `<div class="top"><div class="topRow"><div class="topLeft">${back?`<button class="back" onclick="${back}">←</button>`:''}<b>${title}</b></div><div class="online"><span class="onlineDot"></span>ONLINE</div><button class="profileMini" onclick="profileScreen()">👤</button></div></div>`}
function login(){set(`<div class="login"><div class="logoWrap">${logoTag()}</div><div class="name">DROP<span>LINK</span></div><div class="sub">Deliver. Connect. Move Together.</div><div class="card"><div class="loginTitle">Driver Login</div><input class="field" id="user" placeholder="Driver phone / email"><input class="field" id="pass" type="password" placeholder="Password"><button class="btn gold" onclick="enterApp()">Log In</button><p class="small" style="text-align:center">TEST BUILD — any login details work.</p></div></div>`)}
function enterApp(){playIncoming();driverHome()}
function nav(active){return `<div class="nav"><button class="${active==='home'?'active':''}" onclick="driverHome()"><span class="ico">⌂</span>Home</button><button class="${active==='jobs'?'active':''}" onclick="driverJobs()"><span class="ico">▤</span>Deliveries</button><button class="${active==='map'?'active':''}" onclick="liveMap()"><span class="ico">⌖</span>Navigate</button><button class="${active==='profile'?'active':''}" onclick="profileScreen()"><span class="ico">◉</span>Profile</button></div>`}
function jobCard(j){return `<div class="card job"><div class="row"><h3>${j.id}</h3>${badge(j.status)}</div>${customerBlock(j)}<div class="small">${j.pickup} → ${j.dropoff}</div><p class="small">Package: ${j.items}</p><button class="btn gold" onclick="details('${j.id}')">Open Delivery</button></div>`}
function driverHome(){let mine=jobs.filter(j=>j.driver==='Thabo'),done=mine.filter(j=>j.status==='Completed').length;set(`${header('DROPLINK')}<div class="wrap"><div class="stats"><div class="stat"><div class="n">${mine.length}</div><div class="small">Assigned</div></div><div class="stat"><div class="n">${done}</div><div class="small">Completed</div></div></div><h2>My Deliveries</h2>${mine.map(jobCard).join('')||'<div class="card">No assigned deliveries.</div>'}</div>${nav('home')}`)}
function driverJobs(){set(`${header('Deliveries','driverHome()')}<div class="wrap">${jobs.filter(j=>j.driver==='Thabo').map(jobCard).join('')}</div>${nav('jobs')}`)}
function details(id){cur=jobs.find(j=>j.id===id);let arrived=cur.status==='Arrived';set(`${header(cur.id,'driverHome()')}<div class="wrap"><div class="card"><div class="row"><h3>Delivery Details</h3>${badge(cur.status)}</div><div class="customerDetail">${customerBlock(cur,true)}</div><div class="route"><b>📍 Pickup</b><br>${cur.pickup}</div><div class="route"><b>🏁 Drop-off</b><br>${cur.dropoff}</div><p><b>Package:</b> ${cur.items}</p><button class="btn outline" onclick="dial('${cur.phone}')">Call Customer</button><button class="btn outline" onclick="tripChat('${cur.id}')">💬 Trip Chat</button><button class="btn blue" onclick="maps('${cur.dropoff}')">Open Maps</button>${arrived?'<div class="arrivedBox"><b>Customer notified: Driver arrived</b><div class="small">Arrival tone played for this test.</div></div><button class="btn gold" onclick="proof()">Proof of Delivery</button>':'<button class="btn gold" onclick="startDelivery()">Start / Continue Delivery</button><button class="btn outline" onclick="markArrived()">I\'ve Arrived — Notify Customer</button>'}</div></div>${nav('jobs')}`)}
function startDelivery(){if(!cur)return;cur.status='In Progress';save();liveMap()}
function markArrived(){if(!cur)return;cur.status='Arrived';save();playArrived();details(cur.id)}
function maps(a){if(window.Android&&Android.openMaps)Android.openMaps(a);else alert('Maps: '+a)}function dial(p){if(window.Android&&Android.dial)Android.dial(p);else location.href='tel:'+p}
function liveMap(){set(`${header('Navigation','driverHome()')}<div class="wrap"><div class="map"><div class="path"></div><div class="pin p1"></div><div class="pin p2"></div></div><div class="card"><b>${cur?cur.id:'Current route'}</b><p class="small">${cur?cur.pickup+' → '+cur.dropoff:'Select a delivery to start navigation.'}</p>${cur?`<button class="btn outline" onclick="tripChat('${cur.id}')">💬 Trip Chat</button>`:''}${cur?(cur.status==='Arrived'?'<button class="btn gold" onclick="proof()">Proof of Delivery</button>':'<button class="btn gold" onclick="markArrived()">I\'ve Arrived — Notify Customer</button>'):'<button class="btn blue" onclick="driverHome()">Choose Delivery</button>'}</div></div>${nav('map')}`)}
function proof(){if(!cur)return;set(`${header('Proof of Delivery',`details('${cur.id}')`)}<div class="wrap"><div class="card"><div class="photo" id="photo">Tap to add delivery photo<input type="file" accept="image/*" onchange="preview(this)"></div><input class="field" id="recipient" placeholder="Recipient name"><textarea class="field" id="note" placeholder="Delivery note"></textarea><button class="btn gold" onclick="complete()">Complete Delivery</button></div></div>${nav('jobs')}`)}
function preview(i){let f=i.files[0];if(!f)return;let u=URL.createObjectURL(f);document.getElementById('photo').innerHTML=`<img src="${u}">`}
function complete(){cur.status='Completed';save();set(`${header('DROPLINK')}<div class="wrap"><div class="card"><div class="success">✓</div><h2 style="text-align:center">Delivery Completed!</h2><p style="text-align:center">${cur.id} has been marked completed.</p><button class="btn blue" onclick="driverHome()">Back to Home</button></div></div>${nav('home')}`)}
function tripChat(id){cur=jobs.find(j=>j.id===id)||cur;chatMode='customer';chatScreen('customer')}
function chatScreen(mode=chatMode){if(!cur){driverJobs();return}chatMode=mode;let person=mode==='control'?'DROPLINK Control':cur.customer;let msgs=chats[mode]||[];set(`${header('Trip Chat · '+cur.id,`details('${cur.id}')`)}<div class="wrap"><div class="tripChatIntro">This chat belongs to delivery <b>${cur.id}</b>. Use Customer for the receiver or Control for dispatch support.</div><div class="chatTabs"><button class="${mode==='customer'?'selected':''}" onclick="chatScreen('customer')">Customer</button><button class="${mode==='control'?'selected':''}" onclick="chatScreen('control')">Control</button></div><div class="card"><div class="customerLine">${mode==='customer'?avatar():'<div class="customerAvatar" style="font-size:20px">🎧</div>'}<div class="customerText"><b>${person}</b><span>${mode==='control'?'Dispatch support':'Delivery customer'}</span></div></div><div class="messages" id="messages">${msgs.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${escapeHtml(m.text)}<div class="msgTime">${m.time}</div></div>`).join('')}</div><div class="chatComposer"><input class="field" id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="sendBtn" onclick="sendMessage()">➤</button></div></div></div>${nav('jobs')}`);let el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight}
function sendMessage(){let i=document.getElementById('msg');if(!i||!i.value.trim())return;let now=new Date(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');(chats[chatMode]||(chats[chatMode]=[])).push({from:'me',text:i.value.trim(),time:t});saveChats();chatScreen(chatMode)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function profileScreen(){set(`${header('Profile','driverHome()')}<div class="wrap"><div class="card profileCard"><div class="profileAvatar">👤</div><h2 style="margin:6px 0">Driver Profile</h2><div class="small">DROPLINK Driver Account</div></div><div class="card"><b>App sounds</b><p class="small">Test the two DROPLINK tones.</p><div class="soundRow"><button class="btn outline" onclick="playIncoming()">Incoming tone</button><button class="btn outline" onclick="playArrived()">Arrival tone</button></div><div class="notice">In this test APK, the incoming sound plays when you log in. The arrival sound plays when you tap “I’ve Arrived — Notify Customer”.</div><button class="btn blue" onclick="login()">Log Out</button></div></div>${nav('profile')}`)}
function audioCtx(){return new (window.AudioContext||window.webkitAudioContext)()}
function playSeq(notes,vol=.13){try{let c=audioCtx(),start=c.currentTime+.02;notes.forEach(n=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=n[0];g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(vol,start+.025);g.gain.exponentialRampToValueAtTime(.001,start+n[1]);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+n[1]+.02);start+=n[1]+n[2]});setTimeout(()=>c.close(),2600)}catch(e){}}
function playIncoming(){playSeq([[659,.20,.06],[784,.20,.06],[988,.34,.14],[659,.20,.06],[784,.20,.06],[988,.34,.02]],.14)}
function playArrived(){playSeq([[880,.18,.04],[1175,.22,.04],[1319,.30,.02]],.12)}
login();
</script></body></html>
