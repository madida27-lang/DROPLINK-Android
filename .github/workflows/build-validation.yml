name: Validate DROPLINK Android Bundles
on:
  push:
    branches: [ main, production-linking-v1 ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned release AABs
        run: gradle :customer:bundleRelease :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: droplink-unsigned-aabs
          path: |
            customer/build/outputs/bundle/release/customer-release.aab
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
