name: Build DROPLINK APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Driver and Customer APKs
        run: gradle :app:assembleDebug :customer:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DROPLINK-Driver.apk
          cp customer/build/outputs/apk/debug/customer-debug.apk DROPLINK-Customer.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: DROPLINK-Driver-APK
          path: DROPLINK-Driver.apk
          if-no-files-found: error

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: DROPLINK-Customer-APK
          path: DROPLINK-Customer.apk
          if-no-files-found: error
