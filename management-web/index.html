<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROPLINK Management</title><style>
:root{--n:#002b67;--d:#001a45;--g:#e0a400;--bg:#f4f7fb;--line:#dfe6ef}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#172234}.top{background:linear-gradient(135deg,var(--d),var(--n));color:#fff;padding:18px 24px}.wrap{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.n{font-size:28px;font-weight:900;color:var(--n)}button,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:var(--g);cursor:pointer}.field{padding:11px;border:1px solid var(--line);border-radius:9px;width:100%;margin:5px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:11px;background:#e7efff;color:#174f91;padding:5px 8px;border-radius:99px}.login{max-width:420px;margin:80px auto}.small{font-size:12px;color:#687489}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
const API_BASE='https://deutronomagroup.co.za/droplink-api/index.php';
function apiToken(){return localStorage.getItem('droplink_token')||''}
function setApiToken(t){localStorage.setItem('droplink_token',t||'')}
async function api(route,opt={}){
  const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{}); const t=apiToken(); if(t)headers.Authorization='Bearer '+t;
  const r=await fetch(API_BASE+'?route='+encodeURIComponent(route),Object.assign({},opt,{headers}));
  const j=await r.json().catch(()=>({ok:false,error:'Invalid server response'})); if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status)); return j;
}
function money(v){return 'R'+Number(v||0).toFixed(2).replace('.00','')}

const a=document.getElementById('app');let me=null,orders=[],drivers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function login(m=''){a.innerHTML=`<div class="login"><div class="card"><h1 style="color:var(--n)">DROPLINK Management</h1>${m?'<p style="color:#a22">'+esc(m)+'</p>':''}<input id="u" class="field" placeholder="Admin phone / email"><input id="p" class="field" type="password" placeholder="Password"><button class="btn" onclick="go()">Log In</button></div></div>`}
async function go(){try{let r=await api('auth/login',{method:'POST',body:JSON.stringify({login:document.getElementById('u').value,password:document.getElementById('p').value})});if(r.user.role!=='admin')throw new Error('Admin account required');setApiToken(r.token);me=r.user;dash()}catch(e){login(e.message)}}
async function load(){let [o,d]=await Promise.all([api('orders'),api('drivers')]);orders=o.orders||[];drivers=d.drivers||[]}
async function dash(){try{await load()}catch(e){return login(e.message)}let done=orders.filter(x=>x.status==='Delivered').length,active=orders.filter(x=>x.status!=='Delivered').length;a.innerHTML=`<div class="top"><div class="row"><div><h1 style="margin:0">DROPLINK Management</h1><div>${esc(me.name)}</div></div><button class="btn" onclick="logout()">Log out</button></div></div><div class="wrap"><div class="grid"><div class="card"><div class="n">${orders.length}</div>Total Orders</div><div class="card"><div class="n">${active}</div>Active</div><div class="card"><div class="n">${done}</div>Delivered</div><div class="card"><div class="n">${drivers.length}</div>Drivers</div></div><div class="card"><div class="row"><h2>Deliveries</h2><button class="btn" onclick="dash()">Refresh</button></div>${orders.map(orderRow).join('')||'No deliveries.'}</div><div class="card"><h2>Create Driver</h2><div class="grid"><input class="field" id="dn" placeholder="Driver name"><input class="field" id="dp" placeholder="Phone"><input class="field" id="de" placeholder="Email"><input class="field" id="dw" type="password" placeholder="Temporary password"></div><button class="btn" onclick="newDriver()">Create Driver Account</button></div></div>`}
function orderRow(o){return `<div class="card"><div class="row"><div><b>${esc(o.public_id)} · ${esc(o.customer_name)}</b><div class="small">${esc(o.pickup)} → ${esc(o.dropoff)}</div><div class="small">Driver: ${esc(o.driver_name||'Unassigned')}</div></div><span class="status">${esc(o.status)}</span></div><select class="field" id="d_${o.id}"><option value="">Assign driver</option>${drivers.map(d=>`<option value="${d.id}" ${String(o.driver_id)===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button class="btn" onclick="assign('${esc(o.public_id)}',${o.id})">Save Assignment</button></div>`}
async function assign(pid,id){try{let v=document.getElementById('d_'+id).value;await api('orders/'+pid,{method:'PATCH',body:JSON.stringify({driver_id:v?Number(v):null})});dash()}catch(e){alert(e.message)}}
async function newDriver(){try{await api('drivers',{method:'POST',body:JSON.stringify({name:document.getElementById('dn').value,phone:document.getElementById('dp').value,email:document.getElementById('de').value||null,password:document.getElementById('dw').value})});dash()}catch(e){alert(e.message)}}function logout(){setApiToken('');login()}
(async()=>{if(apiToken()){try{let r=await api('me');if(r.user.role==='admin'){me=r.user;dash();return}}catch(e){}}login()})();
</script></body></html>
