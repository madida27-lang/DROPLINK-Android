<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DROPLINK Customer</title>
<style>
:root{--navy:#002b67;--dark:#001a45;--gold:#e0a400;--gold2:#ffc928;--bg:#f4f7fb;--ink:#172234;--muted:#687489;--line:#dfe6ef;--green:#168047;--red:#c83245}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:80px}.brandbar{height:5px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--navy))}.top{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;padding:13px 15px;position:sticky;top:0;z-index:8}.topRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:42px}.topLeft{display:flex;gap:7px;align-items:center}.topLeft b{font-size:18px}.profileMini{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff18;color:#fff}.wrap{padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #002b6710}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:9px}.gold{background:linear-gradient(var(--gold2),var(--gold));color:#162033}.blue{background:var(--navy);color:#fff}.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff}.small{font-size:12px;color:var(--muted)}h2{font-size:19px;color:var(--navy);margin:10px 0}.login{min-height:calc(100vh - 5px);display:flex;flex-direction:column;justify-content:center;padding:26px 24px}.logoWrap{width:155px;height:155px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 8px 24px #002b6714}.logo{width:138px;height:138px;object-fit:contain}.name{text-align:center;font-size:39px;font-weight:900;color:var(--navy)}.name span{color:var(--gold)}.sub{text-align:center;color:var(--muted);margin:4px 0 22px}.hero{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dce7f5}.newBtn{margin-top:16px;background:linear-gradient(var(--gold2),var(--gold));border:0;border-radius:13px;padding:14px;width:100%;font-weight:900}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .card{margin:0;text-align:center}.quick .ico{font-size:28px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 3px 8px;z-index:12;box-shadow:0 -5px 22px #001a4516}.nav button{border:0;background:#fff;color:var(--muted);padding:5px 1px 3px;font-size:10px}.nav .ico{display:block;font-size:20px;line-height:23px}.nav .active{color:var(--navy);font-weight:bold}.nav .active .ico{color:var(--gold)}.back{border:0;background:none;color:#fff;font-size:22px;padding:4px 6px 4px 0}.sectionTitle{font-size:13px;font-weight:800;color:var(--navy);margin:14px 0 4px}.estimate{background:#fff8df;border:1px solid #efd36b;border-radius:13px;padding:13px;margin-top:10px}.estimate .price{font-size:28px;font-weight:900;color:var(--navy)}.route{padding:11px;background:#f7f9fc;border-radius:12px;margin:8px 0}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#e7efff;color:#164a96;font-size:11px;font-weight:800}.order{border-left:4px solid var(--gold)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.steps{margin:15px 0}.step{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.dot{width:18px;height:18px;border-radius:50%;background:#d7dee8;border:4px solid #eef2f6;flex:0 0 auto;margin-top:1px}.step.on .dot{background:var(--gold);border-color:#fff0b7}.step.done .dot{background:var(--green);border-color:#d8f0e2}.step b{display:block;font-size:13px}.chatBox{display:flex;flex-direction:column;gap:8px;min-height:320px}.bubble{padding:10px 12px;border-radius:14px;max-width:82%;font-size:14px}.mine{align-self:flex-end;background:var(--navy);color:#fff}.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line)}.composer{display:grid;grid-template-columns:1fr 50px;gap:8px}.composer .field{margin:0}.send{border:0;border-radius:12px;background:var(--gold);font-size:19px}.profile{text-align:center}.profileAvatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,var(--navy),#174f91);color:#fff;margin:auto;display:flex;align-items:center;justify-content:center;font-size:30px;border:4px solid #fff;box-shadow:0 4px 16px #002b6725}.note{background:#eef5ff;border:1px solid #cbdcf4;color:#234a76;padding:10px 12px;border-radius:12px;font-size:12px;margin-top:10px}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
let profile=JSON.parse(localStorage.getItem('dlc_profile')||'null')||{name:'Customer',phone:''};
let orders=JSON.parse(localStorage.getItem('dlc_orders')||'[]');
let draft={},current=null;
const app=document.getElementById('app');
const save=()=>localStorage.setItem('dlc_orders',JSON.stringify(orders));
const saveProfile=()=>localStorage.setItem('dlc_profile',JSON.stringify(profile));
const set=x=>{app.innerHTML='<div class="brandbar"></div>'+x;scrollTo(0,0)};
const logo=()=>`<img class="logo" src="file:///android_asset/deutronoma_symbol.png" onerror="this.onerror=null;this.src='file:///android_res/drawable/droplink_logo.png';">`;
function header(title,back=''){return `<div class="top"><div class="topRow"><div class="topLeft">${back?`<button class="back" onclick="${back}">←</button>`:''}<b>${title}</b></div><div></div><button class="profileMini" onclick="profileScreen()">👤</button></div></div>`}
function nav(active){return `<div class="nav"><button class="${active==='home'?'active':''}" onclick="home()"><span class="ico">⌂</span>Home</button><button class="${active==='new'?'active':''}" onclick="newOrder()"><span class="ico">＋</span>New Order</button><button class="${active==='orders'?'active':''}" onclick="ordersScreen()"><span class="ico">▤</span>Orders</button><button class="${active==='profile'?'active':''}" onclick="profileScreen()"><span class="ico">◉</span>Profile</button></div>`}
function login(){set(`<div class="login"><div class="logoWrap">${logo()}</div><div class="name">DROP<span>LINK</span></div><div class="sub">Customer Delivery App</div><div class="card"><h2 style="text-align:center">Customer Login</h2><input class="field" id="name" placeholder="Your name" value="${profile.name==='Customer'?'':profile.name}"><input class="field" id="phone" placeholder="Phone number" value="${profile.phone}"><button class="btn gold" onclick="enter()">Continue</button><p class="small" style="text-align:center">TEST BUILD — no account verification yet.</p></div></div>`)}
function enter(){profile.name=document.getElementById('name').value.trim()||'Customer';profile.phone=document.getElementById('phone').value.trim();saveProfile();home()}
function home(){let active=orders.find(o=>o.status!=='Delivered');set(`${header('DROPLINK')}<div class="wrap"><div class="hero"><h1>Hello, ${esc(profile.name)}</h1><p>Send a parcel anywhere with DROPLINK.</p><button class="newBtn" onclick="newOrder()">＋ Place a Delivery Order</button></div>${active?`<h2>Current Delivery</h2>${orderCard(active)}`:''}<div class="quick"><div class="card" onclick="newOrder()"><div class="ico">📦</div><b>New delivery</b><div class="small">Book a driver</div></div><div class="card" onclick="ordersScreen()"><div class="ico">📍</div><b>My orders</b><div class="small">Track deliveries</div></div></div><div class="note">This is the customer test app. Real driver matching, live GPS, online payments and controller connection will be connected in the production stage.</div></div>${nav('home')}`)}
function newOrder(){draft={};set(`${header('New Delivery','home()')}<div class="wrap"><div class="card"><div class="sectionTitle">PICKUP</div><input class="field" id="pickup" placeholder="Pickup address"><input class="field" id="sender" placeholder="Sender name" value="${esc(profile.name)}"><input class="field" id="senderPhone" placeholder="Sender phone" value="${esc(profile.phone)}"><div class="sectionTitle">DROP-OFF</div><input class="field" id="dropoff" placeholder="Delivery address"><input class="field" id="receiver" placeholder="Receiver name"><input class="field" id="receiverPhone" placeholder="Receiver phone"><div class="sectionTitle">PACKAGE</div><select class="field" id="size"><option value="Documents">Documents</option><option value="Small parcel">Small parcel</option><option value="Medium parcel">Medium parcel</option><option value="Large parcel">Large parcel</option></select><textarea class="field" id="notes" rows="3" placeholder="Package or delivery notes"></textarea><div class="sectionTitle">PAYMENT</div><select class="field" id="payment"><option>Cash</option><option>Card - test only</option></select><button class="btn gold" onclick="reviewOrder()">Get Estimate & Review</button></div></div>${nav('new')}`)}
function reviewOrder(){let g=id=>document.getElementById(id).value.trim();let pickup=g('pickup'),dropoff=g('dropoff');if(!pickup||!dropoff){alert('Please enter pickup and drop-off addresses.');return}draft={pickup,dropoff,sender:g('sender'),senderPhone:g('senderPhone'),receiver:g('receiver')||'Receiver',receiverPhone:g('receiverPhone'),size:document.getElementById('size').value,notes:g('notes'),payment:document.getElementById('payment').value};draft.price=estimate(draft.size);set(`${header('Review Order','newOrder()')}<div class="wrap"><div class="card"><h2>Delivery Summary</h2><div class="route"><b>📍 Pickup</b><br>${esc(draft.pickup)}</div><div class="route"><b>🏁 Drop-off</b><br>${esc(draft.dropoff)}</div><p><b>Receiver:</b> ${esc(draft.receiver)} ${draft.receiverPhone?'<br><span class="small">'+esc(draft.receiverPhone)+'</span>':''}</p><p><b>Package:</b> ${esc(draft.size)}</p><p><b>Payment:</b> ${esc(draft.payment)}</p><div class="estimate"><div class="small">TEST ESTIMATE</div><div class="price">R${draft.price}</div><div class="small">Final production pricing will use real distance and delivery rules.</div></div><button class="btn gold" onclick="confirmOrder()">Confirm Order</button><button class="btn outline" onclick="newOrder()">Edit Order</button></div></div>${nav('new')}`)}
function estimate(size){return {'Documents':55,'Small parcel':65,'Medium parcel':85,'Large parcel':115}[size]||65}
function confirmOrder(){let id='DLK-C'+String(Date.now()).slice(-6);let o={...draft,id,status:'Searching for driver',driver:'',created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),step:0};orders.unshift(o);save();current=o;orderDetails(id)}
function orderCard(o){return `<div class="card order"><div class="row"><b style="color:var(--navy)">${o.id}</b><span class="status">${esc(o.status)}</span></div><div class="route"><span class="small">${esc(o.pickup)}</span><br>→<br><span class="small">${esc(o.dropoff)}</span></div><button class="btn gold" onclick="orderDetails('${o.id}')">View Order</button></div>`}
function ordersScreen(){set(`${header('My Orders','home()')}<div class="wrap"><h2>Delivery Orders</h2>${orders.length?orders.map(orderCard).join(''):'<div class="card">No orders yet.<button class="btn gold" onclick="newOrder()">Place First Order</button></div>'}</div>${nav('orders')}`)}
const statuses=['Searching for driver','Driver assigned','Driver going to pickup','Parcel collected','On the way','Driver arrived','Delivered'];
function orderDetails(id){current=orders.find(o=>o.id===id);if(!current)return ordersScreen();let idx=statuses.indexOf(current.status);set(`${header(current.id,'ordersScreen()')}<div class="wrap"><div class="card"><div class="row"><h2 style="margin:0">Delivery Status</h2><span class="status">${esc(current.status)}</span></div><div class="steps">${statuses.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'on':''}"><span class="dot"></span><div><b>${s}</b>${i===1&&current.driver?'<span class="small">Driver: '+esc(current.driver)+'</span>':''}</div></div>`).join('')}</div><div class="route"><b>📍 Pickup</b><br>${esc(current.pickup)}</div><div class="route"><b>🏁 Drop-off</b><br>${esc(current.dropoff)}</div><p><b>Package:</b> ${esc(current.size)}<br><b>Estimate:</b> R${current.price}</p>${idx>=1&&idx<6?'<button class="btn outline" onclick="tripChat()">💬 Trip Chat</button>':''}${idx>=1&&current.driver?'<button class="btn blue" onclick="dial(\'0710000000\')">Call Driver</button>':''}${idx<6?'<button class="btn gold" onclick="nextStatus()">TEST: Simulate Next Status</button>':''}</div></div>${nav('orders')}`)}
function nextStatus(){let idx=statuses.indexOf(current.status);if(idx<statuses.length-1){idx++;current.status=statuses[idx];if(idx===1)current.driver='DROPLINK Driver 01';save();orderDetails(current.id)}}
function tripChat(){let key='chat_'+current.id;let msgs=JSON.parse(localStorage.getItem(key)||'null')||[{from:'them',text:'Your DROPLINK driver is connected to this trip.'}];set(`${header('Trip Chat',`orderDetails('${current.id}')`)}<div class="wrap"><div class="card"><div class="row"><div><b>${esc(current.id)}</b><div class="small">${esc(current.driver||'DROPLINK Driver')}</div></div><span class="status">Active Trip</span></div><div class="chatBox" id="chatBox">${msgs.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${esc(m.text)}</div>`).join('')}</div><div class="composer"><input class="field" id="msg" placeholder="Type a message..."><button class="send" onclick="sendChat('${key}')">➤</button></div></div></div>${nav('orders')}`);let b=document.getElementById('chatBox');if(b)b.scrollTop=b.scrollHeight}
function sendChat(key){let i=document.getElementById('msg');if(!i||!i.value.trim())return;let msgs=JSON.parse(localStorage.getItem(key)||'[]');msgs.push({from:'me',text:i.value.trim()});localStorage.setItem(key,JSON.stringify(msgs));tripChat()}
function profileScreen(){set(`${header('Profile','home()')}<div class="wrap"><div class="card profile"><div class="profileAvatar">👤</div><h2>${esc(profile.name)}</h2><div class="small">${esc(profile.phone||'No phone saved')}</div></div><div class="card"><input class="field" id="pn" value="${esc(profile.name)}" placeholder="Name"><input class="field" id="pp" value="${esc(profile.phone)}" placeholder="Phone"><button class="btn gold" onclick="saveProfileForm()">Save Profile</button><button class="btn outline" onclick="login()">Log Out</button></div></div>${nav('profile')}`)}
function saveProfileForm(){profile.name=document.getElementById('pn').value.trim()||'Customer';profile.phone=document.getElementById('pp').value.trim();saveProfile();profileScreen()}
function dial(p){if(window.Android&&Android.dial)Android.dial(p);else location.href='tel:'+p}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
login();
</script>
</body>
</html>
