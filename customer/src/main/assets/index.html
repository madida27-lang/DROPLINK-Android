<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DROPLINK</title>
<style>
:root{--navy:#002b67;--dark:#001a45;--gold:#e0a400;--gold2:#ffc928;--bg:#f4f7fb;--ink:#172234;--muted:#687489;--line:#dfe6ef;--green:#168047;--red:#c83245}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:80px}.brandbar{height:5px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--navy))}.top{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;padding:13px 15px;position:sticky;top:0;z-index:8}.topRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:42px}.topLeft{display:flex;gap:7px;align-items:center}.profileMini{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff18;color:#fff}.wrap{padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #002b6710}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:9px}.gold{background:linear-gradient(var(--gold2),var(--gold));color:#162033}.blue{background:var(--navy);color:#fff}.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff}.small{font-size:12px;color:var(--muted)}h2{font-size:19px;color:var(--navy);margin:10px 0}.login{min-height:calc(100vh - 5px);display:flex;flex-direction:column;justify-content:center;padding:26px 24px}.logoWrap{width:155px;height:155px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 8px 24px #002b6714}.logo{width:138px;height:138px;object-fit:contain}.name{text-align:center;font-size:39px;font-weight:900;color:var(--navy)}.name span{color:var(--gold)}.sub{text-align:center;color:var(--muted);margin:4px 0 22px}.hero{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dce7f5}.newBtn{margin-top:16px;background:linear-gradient(var(--gold2),var(--gold));border:0;border-radius:13px;padding:14px;width:100%;font-weight:900}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .card{margin:0;text-align:center}.quick .ico{font-size:28px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 3px 8px;z-index:12;box-shadow:0 -5px 22px #001a4516}.nav button{border:0;background:#fff;color:var(--muted);padding:5px 1px 3px;font-size:10px}.nav .ico{display:block;font-size:20px;line-height:23px}.nav .active{color:var(--navy);font-weight:bold}.nav .active .ico{color:var(--gold)}.back{border:0;background:none;color:#fff;font-size:22px}.sectionTitle{font-size:13px;font-weight:800;color:var(--navy);margin:14px 0 4px}.estimate{background:#fff8df;border:1px solid #efd36b;border-radius:13px;padding:13px;margin-top:10px}.priceLine{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:18px;font-weight:900;border-top:1px solid #ead47c;padding-top:9px}.route{padding:11px;background:#f7f9fc;border-radius:12px;margin:8px 0}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#e7efff;color:#164a96;font-size:11px;font-weight:800}.order{border-left:4px solid var(--gold)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.chatBox{display:flex;flex-direction:column;gap:8px;min-height:320px;max-height:55vh;overflow:auto}.bubble{padding:10px 12px;border-radius:14px;max-width:82%;font-size:14px}.mine{align-self:flex-end;background:var(--navy);color:#fff}.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line)}.composer{display:grid;grid-template-columns:1fr 50px;gap:8px}.composer .field{margin:0}.send{border:0;border-radius:12px;background:var(--gold);font-size:19px}.err{background:#ffe5e8;color:#8e2030;padding:10px;border-radius:10px;margin:8px 0}.ok{background:#e4f4e9;color:#176832;padding:10px;border-radius:10px;margin:8px 0}
</style></head><body><div class="app" id="app"></div><script>
const API_BASE='https://deutronomagroup.co.za/droplink-api/index.php';
function apiToken(){return localStorage.getItem('droplink_token')||''}
function setApiToken(t){localStorage.setItem('droplink_token',t||'')}
async function api(route,opt={}){
  const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{}); const t=apiToken(); if(t)headers.Authorization='Bearer '+t;
  const r=await fetch(API_BASE+'?route='+encodeURIComponent(route),Object.assign({},opt,{headers}));
  const j=await r.json().catch(()=>({ok:false,error:'Invalid server response'})); if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status)); return j;
}
function money(v){return 'R'+Number(v||0).toFixed(2).replace('.00','')}

let me=JSON.parse(localStorage.getItem('droplink_me')||'null'),orders=[],draft={},current=null;const app=document.getElementById('app');
const set=x=>{app.innerHTML='<div class="brandbar"></div>'+x;scrollTo(0,0)};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const logo=()=>`<img class="logo" src="file:///android_asset/deutronoma_symbol.png">`;
function header(t,b=''){return `<div class="top"><div class="topRow"><div class="topLeft">${b?`<button class="back" onclick="${b}">←</button>`:''}<b>${t}</b></div><div></div><button class="profileMini" onclick="profile()">👤</button></div></div>`}
function nav(a){return `<div class="nav"><button class="${a==='home'?'active':''}" onclick="home()"><span class="ico">⌂</span>Home</button><button class="${a==='new'?'active':''}" onclick="newOrder()"><span class="ico">＋</span>New Order</button><button class="${a==='orders'?'active':''}" onclick="ordersScreen()"><span class="ico">▤</span>Orders</button><button class="${a==='profile'?'active':''}" onclick="profile()"><span class="ico">◉</span>Profile</button></div>`}
function login(msg=''){set(`<div class="login"><div class="logoWrap">${logo()}</div><div class="name">DROP<span>LINK</span></div><div class="sub">Customer Delivery App</div><div class="card"><h2 style="text-align:center">Customer Login</h2>${msg?`<div class="err">${esc(msg)}</div>`:''}<input class="field" id="login" placeholder="Phone number"><input class="field" id="pass" type="password" inputmode="numeric" placeholder="PIN / password"><button class="btn gold" onclick="doLogin()">Log In</button><button class="btn outline" onclick="registerScreen()">Create Customer Account</button></div></div>`)}
function registerScreen(){set(`<div class="login"><div class="logoWrap">${logo()}</div><div class="name">DROP<span>LINK</span></div><div class="card"><h2>Create Account</h2><input class="field" id="rn" placeholder="Full name"><input class="field" id="rp" placeholder="Phone number"><input class="field" id="rpass" type="password" inputmode="numeric" placeholder="Create PIN / password"><button class="btn gold" onclick="register()">Create Account</button><button class="btn outline" onclick="login()">Back to Login</button></div></div>`)}
async function register(){try{let r=await api('auth/register-customer',{method:'POST',body:JSON.stringify({name:document.getElementById('rn').value.trim(),phone:document.getElementById('rp').value.trim(),password:document.getElementById('rpass').value})});setApiToken(r.token);me=r.user;localStorage.setItem('droplink_me',JSON.stringify(me));await refreshOrders();home()}catch(e){alert(e.message)}}
async function doLogin(){try{let r=await api('auth/login',{method:'POST',body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('pass').value})});if(r.user.role!=='customer')throw new Error('Please use a customer account.');setApiToken(r.token);me=r.user;localStorage.setItem('droplink_me',JSON.stringify(me));await refreshOrders();home()}catch(e){login(e.message)}}
async function refreshOrders(){let r=await api('orders');orders=r.orders||[]}
function mapOrder(o){return {id:o.public_id,status:o.status,pickup:o.pickup,dropoff:o.dropoff,size:o.package_size,price:Number(o.delivery_fee||0),tip:Number(o.driver_tip||0),driver:o.driver_name||'',driverPhone:o.driver_phone||''}}
function card(o0){let o=mapOrder(o0);return `<div class="card order"><div class="row"><b style="color:var(--navy)">${esc(o.id)}</b><span class="status">${esc(o.status)}</span></div><div class="route">${esc(o.pickup)}<br>→<br>${esc(o.dropoff)}</div><button class="btn gold" onclick="details('${esc(o.id)}')">View Order</button></div>`}
async function home(){try{await refreshOrders()}catch(e){}let a=orders.find(x=>x.status!=='Delivered');set(`${header('DROPLINK')}<div class="wrap"><div class="hero"><h1>Hello, ${esc(me?.name||'Customer')}</h1><p>Send a parcel with DROPLINK.</p><button class="newBtn" onclick="newOrder()">＋ Place a Delivery Order</button></div>${a?'<h2>Current Delivery</h2>'+card(a):''}<div class="quick"><div class="card" onclick="newOrder()"><div class="ico">📦</div><b>New delivery</b><div class="small">Book a driver</div></div><div class="card" onclick="ordersScreen()"><div class="ico">📍</div><b>My orders</b><div class="small">Track deliveries</div></div></div></div>${nav('home')}`)}
function newOrder(){draft={};set(`${header('New Delivery','home()')}<div class="wrap"><div class="card"><div class="sectionTitle">PICKUP</div><input class="field" id="pickup" placeholder="Pickup address"><input class="field" id="sender" placeholder="Sender name" value="${esc(me?.name||'')}"><input class="field" id="senderPhone" placeholder="Sender phone" value="${esc(me?.phone||'')}"><div class="sectionTitle">DROP-OFF</div><input class="field" id="dropoff" placeholder="Delivery address"><input class="field" id="receiver" placeholder="Receiver name"><input class="field" id="receiverPhone" placeholder="Receiver phone"><div class="sectionTitle">PACKAGE</div><select class="field" id="size"><option>Documents</option><option>Small parcel</option><option>Medium parcel</option><option>Large parcel</option></select><textarea class="field" id="notes" placeholder="Package or delivery notes"></textarea><div class="sectionTitle">PAYMENT</div><select class="field" id="payment"><option>Cash</option></select><button class="btn gold" onclick="review()">Get Estimate & Review</button></div></div>${nav('new')}`)}
function fee(s){return {'Documents':55,'Small parcel':65,'Medium parcel':85,'Large parcel':115}[s]||65}
function review(){let g=id=>document.getElementById(id).value.trim();if(!g('pickup')||!g('dropoff'))return alert('Pickup and drop-off are required.');draft={pickup:g('pickup'),dropoff:g('dropoff'),sender_name:g('sender'),sender_phone:g('senderPhone'),receiver_name:g('receiver'),receiver_phone:g('receiverPhone'),package_size:document.getElementById('size').value,notes:g('notes'),payment_method:document.getElementById('payment').value,delivery_fee:fee(document.getElementById('size').value),driver_tip:0};set(`${header('Review Order','newOrder()')}<div class="wrap"><div class="card"><h2>Delivery Summary</h2><div class="route"><b>Pickup</b><br>${esc(draft.pickup)}</div><div class="route"><b>Drop-off</b><br>${esc(draft.dropoff)}</div><p><b>Package:</b> ${esc(draft.package_size)}</p><div class="estimate"><b>Tip your driver</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px"><button onclick="tip(0)">No tip</button><button onclick="tip(10)">R10</button><button onclick="tip(20)">R20</button><button onclick="tip(30)">R30</button></div><div class="priceLine"><span>Delivery fee</span><b>${money(draft.delivery_fee)}</b></div><div class="priceLine"><span>Driver tip</span><b id="tipv">R0</b></div><div class="priceLine total"><span>Total</span><b id="totalv">${money(draft.delivery_fee)}</b></div></div><button class="btn gold" onclick="confirmOrder()">Confirm Order</button></div></div>${nav('new')}`)}
function tip(v){draft.driver_tip=Number(v);document.getElementById('tipv').textContent=money(v);document.getElementById('totalv').textContent=money(draft.delivery_fee+draft.driver_tip)}
async function confirmOrder(){try{let r=await api('orders',{method:'POST',body:JSON.stringify(draft)});await refreshOrders();details(r.order.public_id)}catch(e){alert(e.message)}}
async function ordersScreen(){try{await refreshOrders()}catch(e){return alert(e.message)}set(`${header('My Orders','home()')}<div class="wrap">${orders.length?orders.map(card).join(''):'<div class="card">No orders yet.</div>'}</div>${nav('orders')}`)}
async function details(id){try{let r=await api('orders/'+id),o=mapOrder(r.order);current=o;set(`${header(o.id,'ordersScreen()')}<div class="wrap"><div class="card"><div class="row"><h2>Delivery Status</h2><span class="status">${esc(o.status)}</span></div><div class="route"><b>Pickup</b><br>${esc(o.pickup)}</div><div class="route"><b>Drop-off</b><br>${esc(o.dropoff)}</div><p><b>Package:</b> ${esc(o.size)}<br><b>Delivery fee:</b> ${money(o.price)}<br><b>Driver tip:</b> ${money(o.tip)}</p>${o.driver?`<p><b>Driver:</b> ${esc(o.driver)}</p><button class="btn outline" onclick="chat()">💬 Trip Chat</button><button class="btn blue" onclick="dial('${esc(o.driverPhone)}')">Call Driver</button>`:''}</div></div>${nav('orders')}`)}catch(e){alert(e.message)}}
async function chat(){try{let r=await api('orders/'+current.id+'/messages'),msgs=r.messages||[];set(`${header('Trip Chat',`details('${current.id}')`)}<div class="wrap"><div class="card"><div class="chatBox" id="chatBox">${msgs.map(m=>`<div class="bubble ${m.sender_role==='customer'?'mine':'theirs'}">${esc(m.message)}</div>`).join('')}</div><div class="composer"><input class="field" id="msg" placeholder="Type a message..."><button class="send" onclick="sendMsg()">➤</button></div></div></div>${nav('orders')}`)}catch(e){alert(e.message)}}
async function sendMsg(){let v=document.getElementById('msg').value.trim();if(!v)return;try{await api('orders/'+current.id+'/messages',{method:'POST',body:JSON.stringify({message:v,recipient_scope:'driver'})});chat()}catch(e){alert(e.message)}}
function profile(){set(`${header('Profile','home()')}<div class="wrap"><div class="card"><h2>${esc(me?.name||'Customer')}</h2><div class="small">${esc(me?.phone||'')}</div><button class="btn outline" onclick="logout()">Log Out</button></div></div>${nav('profile')}`)}
function logout(){setApiToken('');localStorage.removeItem('droplink_me');me=null;login()}
function dial(p){if(window.Android&&Android.dial)Android.dial(p);else location.href='tel:'+p}
(async()=>{if(apiToken()){try{let r=await api('me');if(r.user.role!=='customer')throw 0;me=r.user;await refreshOrders();home();return}catch(e){}}login()})();
</script></body></html>
