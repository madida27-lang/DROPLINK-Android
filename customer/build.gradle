plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.deutronomagroup.droplink.customer'
    compileSdk 35

    defaultConfig {
        applicationId 'za.co.deutronomagroup.droplink.customer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
